[package]
name = "liquidity_vault"
version = "0.1.0"
description = "Liquidity Vault with Raydium CLMM CPI"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "liquidity_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = [
    "anchor-lang/idl-build",
    "anchor-spl/idl-build",
    "raydium-clmm-cpi/idl-build"
]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "=1.2.2"
anchor-spl = "=1.2.2"
raydium-clmm-cpi = { path = "../../vendor/raydium-clmm-cpi", features = ["cpi", "devnet"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
